[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "scalenav"
version = "0.0.8"
authors = [
  { name = "Ivann Schlosser", email = "ivann.schlosser@ouce.ox.ac.uk" },
]
maintainers = [
  { name = "Ivann Schlosser", email = "ivann.schlosser@ouce.ox.ac.uk" },
  { name = "Tom Russell", email = "tom.russell@ouce.ox.ac.uk" },
]
description = "A package to project all sorts of data on the H3 grid and manipulate it at different spatial scales."
readme = "README.md"
dependencies = [
  'duckdb>=1.5.5',
  'h3>=4.0.0',
  "geopandas",
  "ibis-framework[duckdb,geospatial]",
  "matplotlib",
  "numpy",
  "pandas",
  "pyarrow>=23.0.1",
  "pypalettes",
  "rasterio",
  "scikit-learn",
  "scipy",
  "sentence-transformers",
  "shapely",
  "tqdm",
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
license = { file = "LICENSE.txt" }
keywords = ['hierarchical index', 'rescaling', 'geospatial']

[project.optional-dependencies]
dev = ["flit", "pytest", "ruff"]
docs = ["furo", "ipykernel", "myst-nb", "pydeck", "sphinx-design", "sphinx"]

[project.urls]
Homepage = "https://github.com/nismod/scale-nav"
Issues = "https://github.com/nismod/scale-nav/issues"
Documentation = "https://nismod.github.io/scale-nav/"

[project.scripts]
rastapar = "scalenav.rast_convert_par:rast_converter"

[project.gui-scripts]
rastapar = "scalenav.rast_convert_par:rast_converter"

[tool.flit.external-data]
directory = "data"
